name: Test

# Manuell starten: einen Beitrag rendern (Ergebnis als Download), die Buffer-Verbindung prüfen
# oder Hörproben aus proben/*.json rendern (aktion "probe", danach unter …/m/probe_*.mp4 abrufbar).
on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "rendern, buffer-test oder probe"
        default: "rendern"
      beitrag:
        description: "ID aus der Warteschlange, z. B. C01-T01-V"
        default: "C01-T01-V"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kanal
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          mkdir -p fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sSfL -o fonts/Poppins-Bold.ttf $B/poppins/Poppins-Bold.ttf
          curl -sSfL -o fonts/Poppins-SemiBold.ttf $B/poppins/Poppins-SemiBold.ttf
          curl -sSfL -o fonts/Poppins-Medium.ttf $B/poppins/Poppins-Medium.ttf
          curl -sSfL -o fonts/Lora.ttf "$B/lora/Lora%5Bwght%5D.ttf"
      - name: Buffer prüfen
        if: github.event.inputs.aktion == 'buffer-test'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python kanal.py buffer-test
      - name: Rendern
        if: github.event.inputs.aktion == 'rendern'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: |
          echo '["${{ github.event.inputs.beitrag }}"]' > faellig.json
          python kanal.py produzieren ausgabe
      - uses: actions/upload-artifact@v4
        if: github.event.inputs.aktion == 'rendern'
        with:
          name: test
          path: ausgabe/m/
          retention-days: 7
      - name: Hörproben rendern
        if: github.event.inputs.aktion == 'probe'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: |
          mkdir -p site/m
          if git ls-remote --exit-code origin medien >/dev/null; then
            git fetch -q origin medien
            git archive origin/medien | tar -x -C site
          fi
          for f in proben/*.json; do
            n=$(basename "$f" .json)
            python render.py "$f" auto "site/m/$n.mp4" --stimme elevenlabs
          done
          cp -r site /tmp/medien && cd /tmp/medien
          git init -q -b medien
          git config user.name "kanal-bot"
          git config user.email "kanal-bot@users.noreply.github.com"
          git add -A && git commit -qm "Medien + Hörproben"
          git remote add origin "$(cd "$GITHUB_WORKSPACE" && git remote get-url origin)"
          git -c http.extraheader="$(cd "$GITHUB_WORKSPACE" && git config --get http.https://github.com/.extraheader)" push -qf origin medien
      - uses: actions/upload-pages-artifact@v3
        if: github.event.inputs.aktion == 'probe'
        with: { path: site }

  bereitstellen:
    needs: test
    if: github.event.inputs.aktion == 'probe'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
