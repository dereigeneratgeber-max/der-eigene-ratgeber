name: Kennzahlen

# Holt einmal am Tag Aufrufe, Likes, Kommentare usw. aus Buffer und legt sie in metriken.json ab.
on:
  schedule:
    - cron: "41 6 * * *"      # nach "Kanal täglich"
  workflow_dispatch:
    inputs:
      schema:
        description: "ja = zusätzlich die Felder der Buffer-Schnittstelle speichern"
        default: "nein"

permissions:
  contents: write

concurrency:
  group: kanal
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kennzahlen holen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python metriken.py ${{ github.event.inputs.schema == 'ja' && '--schema' || '' }}
      - name: Sichern
        if: always()
        run: |
          git config user.name "kanal-bot"
          git config user.email "kanal-bot@users.noreply.github.com"
          git add metriken.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "Kennzahlen" && git pull -q --rebase origin main && git push -q origin HEAD:main)
